<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{base_tag}}}<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#0b161e">
<meta name="color-scheme" content="dark">
{{#if noindex}}<meta name="robots" content="noindex">
{{/if}}{{#if site_url}}<link rel="canonical" href="{{site_url}}{{canonical_path}}">
<meta property="og:url" content="{{site_url}}{{canonical_path}}">
<meta property="og:image" content="{{site_url}}{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{site_url}}{{og_image}}">
{{/if}}<meta property="og:type" content="website">
<meta property="og:site_name" content="{{publisher}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
